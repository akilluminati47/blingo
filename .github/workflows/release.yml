name: Release

# Every push to main (website deploy included) increments the version with decimal rollover
# (0.0.9 -> 0.1.0, 0.9.9 -> 1.0.0), builds the Windows app + Android APK, and posts them
# all to one GitHub Release at the new tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    # the version-bump commit this workflow pushes must not retrigger itself
    if: "!contains(github.event.head_commit.message, '[no-retrigger]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump version and tag
        id: bump
        shell: pwsh
        run: |
          # decimal rollover: 0.0.9 -> 0.1.0, 0.9.9 -> 1.0.0 (no double digits per segment)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $p = (node -p "require('./package.json').version").Split('.')
          $major = [int]$p[0]; $minor = [int]$p[1]; $patch = [int]$p[2]
          $patch++
          if ($patch -gt 9) { $patch = 0; $minor++
            if ($minor -gt 9) { $minor = 0; $major++ } }
          $v = "$major.$minor.$patch"
          $code = $major * 100 + $minor * 10 + $patch
          npm version $v --no-git-tag-version --allow-same-version
          # keep the android project in lockstep with the release version
          $gradle = Get-Content android/app/build.gradle -Raw
          $gradle = $gradle -replace 'versionCode \d+', "versionCode $code"
          $gradle = $gradle -replace 'versionName "[^"]*"', "versionName ""$v"""
          Set-Content android/app/build.gradle $gradle -NoNewline
          # single source of truth the running game reads at startup to show
          # "Loaded: vN.N.N" on the policies page, next to the latest GitHub release
          Set-Content version.json "{`n  ""version"": ""v$v""`n}`n" -NoNewline
          git add package.json package-lock.json android/app/build.gradle version.json
          git commit -m "Release v$v [no-retrigger]"
          git tag "v$v"
          git push origin main --follow-tags
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # create the (empty) release up front so the two build jobs can both upload to it
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: BLINGO v${{ steps.bump.outputs.version }}
          make_latest: true
          body: |
            Standalone builds of **BLINGO** v${{ steps.bump.outputs.version }}.

            - **BLINGO Setup ${{ steps.bump.outputs.version }}.exe** — Windows installer (recommended)
            - **BLINGO-${{ steps.bump.outputs.version }}-portable.exe** — Windows no-install single file
            - **BLINGO-${{ steps.bump.outputs.version }}-android.apk** — Android sideload (allow "install unknown apps" when prompted)
            - **BLINGO-${{ steps.bump.outputs.version }}-ios.ipa** — iOS sideload via AltStore / SideStore

            Play instantly in the browser instead: https://blingo.pages.dev

            Play in a Discord Activity with your server: https://discord.com/oauth2/authorize?client_id=1533697932149264495

  windows:
    needs: bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the bump commit, so the app embeds the new version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npx electron-builder --win --publish never

      - name: Upload Windows builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.bump.outputs.version }}" dist/*.exe dist/*.blockmap --clobber

  android:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the bump commit, so the APK wears the new versionName

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Stage web assets and sync Capacitor
        run: |
          node scripts/copy-web.mjs
          npx cap sync android

      - name: Generate app icons from blingo.png
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for d in android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}; do
            case $(basename $d) in
              mipmap-mdpi)   s=48  fs=108 ;;
              mipmap-hdpi)   s=72  fs=162 ;;
              mipmap-xhdpi)  s=96  fs=216 ;;
              mipmap-xxhdpi) s=144 fs=324 ;;
              mipmap-xxxhdpi)s=192 fs=432 ;;
            esac
            convert blingo.png -resize ${s}x${s}   "$d/ic_launcher.png"
            convert blingo.png -resize ${s}x${s}   "$d/ic_launcher_round.png"
            convert blingo.png -resize ${fs}x${fs} "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        working-directory: android
        run: bash gradlew assembleRelease --no-daemon

      - name: Sign APK
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          V: ${{ needs.bump.outputs.version }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/ks.p12
          echo "decoded p12: $(stat -c%s /tmp/ks.p12) bytes, sha256 $(sha256sum /tmp/ks.p12 | cut -d' ' -f1)"
          openssl pkcs12 -info -in /tmp/ks.p12 -passin "pass:$ANDROID_KEYSTORE_PASSWORD" -nokeys -noout \
            && echo "openssl verify OK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/ks.p12 --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out "BLINGO-$V-android.apk" /tmp/aligned.apk
          "$BT/apksigner" verify "BLINGO-$V-android.apk" && echo "APK signature OK"
          rm -f /tmp/ks.p12

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump.outputs.version }}
        run: gh release upload "v$V" "BLINGO-$V-android.apk" --clobber

  ios:
    needs: bump
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stage web assets and sync Capacitor
        run: |
          node scripts/copy-web.mjs
          npx cap add ios
          npx cap sync ios

      - name: Disable code signing in Xcode project
        run: |
          cd ios/App
          # Force-disable signing at the project level
          /usr/libexec/PlistBuddy -c "Set :objects:$(grep -o '[A-F0-9]\{24\}' App.xcodeproj/project.pbxproj | head -1):buildSettings:CODE_SIGN_IDENTITY ''" App.xcodeproj/project.pbxproj 2>/dev/null || true
          # Use sed to nuke all signing settings in one pass
          sed -i '' 's/CODE_SIGN_IDENTITY = "[^"]*"/CODE_SIGN_IDENTITY = ""/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Za-z0-9]*/DEVELOPMENT_TEAM = ""/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = "[^"]*"/PROVISIONING_PROFILE_SPECIFIER = ""/g' App.xcodeproj/project.pbxproj
          echo "Signing disabled in project"

      - name: Build iOS IPA (unsigned)
        env:
          V: ${{ needs.bump.outputs.version }}
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS'
          APP=$(find build -name "*.app" -type d -maxdepth 4 | head -1)
          echo "Found app at: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r -y "../../BLINGO-$V-ios.ipa" Payload/
          echo "IPA created: $(stat -f%z ../../BLINGO-$V-ios.ipa) bytes"

      - name: Upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.bump.outputs.version }}
        run: gh release upload "v$V" "BLINGO-$V-ios.ipa" --clobber
